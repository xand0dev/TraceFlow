<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="How it works: the read-only parser reads your code, the core watches files, computes the diff and collects traffic from the SDKs, and serves the live map and the MCP tools.">
<title>How it works: the read-only parser reads your code, the core watches files, computes the diff and collects traffic from the SDKs, and serves the live map and the MCP tools.</title>
<style>
.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes dash{to{stroke-dashoffset:-14}}
.breathe{animation:breathe 4s ease-in-out infinite}
.flow{stroke-dasharray:3 4;animation:dash 1.6s linear infinite}
@media (prefers-reduced-motion:reduce){.breathe,.flow{animation:none}}
.compact{display:none} @media (max-width:560px){.full{display:none} .compact{display:inline}}</style>
<defs>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#34363B"/><stop offset=".5" stop-color="#16171A"/><stop offset="1" stop-color="#26282C"/>
</linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<radialGradient id="redLight"><stop offset="0" stop-color="#E0101A" stop-opacity=".5"/>
  <stop offset=".4" stop-color="#E0101A" stop-opacity=".12"/><stop offset="1" stop-color="#E0101A" stop-opacity="0"/></radialGradient>
<linearGradient id="hair" x1="0" x2="1"><stop offset="0" stop-color="#8B8F96" stop-opacity=".45"/><stop offset="1" stop-color="#8B8F96" stop-opacity="0"/></linearGradient>
</defs>
<rect x="1" y="1" width="1198" height="298" rx="14" fill="#050506" stroke="url(#edge)" stroke-width="1.5"/>
<path class="flow" d="M236 105 L286 105" stroke="#2A2C31" fill="none" stroke-width="1.5"/><circle r="3.2" fill="#C9CDD3"><animateMotion dur="1.6s" begin="0.00s" repeatCount="indefinite" path="M236 105 L286 105"/></circle><path class="flow" d="M486 105 L536 105" stroke="#2A2C31" fill="none" stroke-width="1.5"/><circle r="3.2" fill="#C9CDD3"><animateMotion dur="1.6s" begin="0.00s" repeatCount="indefinite" path="M486 105 L536 105"/></circle><path class="flow" d="M756 95 C796 95 796 75 836 75" stroke="#2A2C31" fill="none" stroke-width="1.5"/><circle r="3.2" fill="#C9CDD3"><animateMotion dur="1.6s" begin="0.00s" repeatCount="indefinite" path="M756 95 C796 95 796 75 836 75"/></circle><path class="flow" d="M756 115 C796 115 796 175 836 175" stroke="#2A2C31" fill="none" stroke-width="1.5"/><circle r="3.2" fill="#FF2A2A"><animateMotion dur="1.6s" begin="0.00s" repeatCount="indefinite" path="M756 115 C796 115 796 175 836 175"/></circle><path class="flow" d="M486 205 C516 205 516 125 536 125" stroke="#2A2C31" fill="none" stroke-width="1.5"/><circle r="3.2" fill="#FF2A2A"><animateMotion dur="1.6s" begin="0.00s" repeatCount="indefinite" path="M486 205 C516 205 516 125 536 125"/></circle><rect x="36" y="70" width="200" height="70" rx="10" fill="#0B0C0E" stroke="#4A4E55" stroke-width="1.5"/><text x="56" y="100" class="m" font-size="13" fill="#F2F3F5" font-weight="700" letter-spacing="2.4" xml:space="preserve">YOUR CODE</text><text x="56" y="123" class="s" font-size="14" fill="#9A9FA7" xml:space="preserve">Django · React · RN</text><rect x="286" y="70" width="200" height="70" rx="10" fill="#0B0C0E" stroke="#4A4E55" stroke-width="1.5"/><text x="306" y="100" class="m" font-size="13" fill="#F2F3F5" font-weight="700" letter-spacing="2.4" xml:space="preserve">PARSER</text><text x="306" y="123" class="s" font-size="14" fill="#9A9FA7" xml:space="preserve">ast · read-only</text><rect x="536" y="70" width="220" height="70" rx="10" fill="#0B0C0E" stroke="#FF2A2A" stroke-width="1.5" class="breathe"/><text x="556" y="100" class="m" font-size="13" fill="#F2F3F5" font-weight="700" letter-spacing="2.4" xml:space="preserve">CORE</text><text x="556" y="123" class="s" font-size="14" fill="#9A9FA7" xml:space="preserve">watch · diff · traffic</text><rect x="836" y="40" width="328" height="70" rx="10" fill="#0B0C0E" stroke="#4A4E55" stroke-width="1.5"/><text x="856" y="70" class="m" font-size="13" fill="#F2F3F5" font-weight="700" letter-spacing="2.4" xml:space="preserve">MAP</text><text x="856" y="93" class="s" font-size="14" fill="#9A9FA7" xml:space="preserve">localhost:4317</text><rect x="836" y="140" width="328" height="70" rx="10" fill="#0B0C0E" stroke="#4A4E55" stroke-width="1.5"/><text x="856" y="170" class="m" font-size="13" fill="#F2F3F5" font-weight="700" letter-spacing="2.4" xml:space="preserve">MCP</text><text x="856" y="193" class="s" font-size="14" fill="#9A9FA7" xml:space="preserve">Claude · Codex · Cursor</text><rect x="286" y="170" width="200" height="70" rx="10" fill="#0B0C0E" stroke="#4A4E55" stroke-width="1.5"/><text x="306" y="200" class="m" font-size="13" fill="#F2F3F5" font-weight="700" letter-spacing="2.4" xml:space="preserve">SDK</text><text x="306" y="223" class="s" font-size="14" fill="#9A9FA7" xml:space="preserve">middleware · fetch</text><text x="36" y="276" class="m" font-size="12" fill="#5E636B" font-weight="700" letter-spacing="1.2" xml:space="preserve">local only  ·  no accounts  ·  no AI calls of its own  ·  never writes to your project</text>
</svg>
