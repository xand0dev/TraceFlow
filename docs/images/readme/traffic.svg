<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Live traffic: copy the Django middleware or the React fetch wrapper from sdk/, or POST JSON to /api/ingest. No dependencies, sends in the background.">
<title>Live traffic: copy the Django middleware or the React fetch wrapper from sdk/, or POST JSON to /api/ingest. No dependencies, sends in the background.</title>
<style>
.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes dash{to{stroke-dashoffset:-14}}
.breathe{animation:breathe 4s ease-in-out infinite}
.flow{stroke-dasharray:3 4;animation:dash 1.6s linear infinite}
@media (prefers-reduced-motion:reduce){.breathe,.flow{animation:none}}
.compact{display:none} @media (max-width:560px){.full{display:none} .compact{display:inline}}</style>
<defs>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#34363B"/><stop offset=".5" stop-color="#16171A"/><stop offset="1" stop-color="#26282C"/>
</linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<radialGradient id="redLight"><stop offset="0" stop-color="#E0101A" stop-opacity=".5"/>
  <stop offset=".4" stop-color="#E0101A" stop-opacity=".12"/><stop offset="1" stop-color="#E0101A" stop-opacity="0"/></radialGradient>
<linearGradient id="hair" x1="0" x2="1"><stop offset="0" stop-color="#8B8F96" stop-opacity=".45"/><stop offset="1" stop-color="#8B8F96" stop-opacity="0"/></linearGradient>
</defs>
<rect x="1" y="1" width="1198" height="198" rx="14" fill="#050506" stroke="url(#edge)" stroke-width="1.5"/>
<text x="36" y="58" class="m" font-size="12" fill="#5E636B" font-weight="700" letter-spacing="2.4" xml:space="preserve">DJANGO</text><text x="36" y="100" class="m" font-size="19" fill="#F2F3F5" font-weight="700" xml:space="preserve">sdk/django_middleware.py</text><text x="36" y="132" class="s" font-size="16" fill="#9A9FA7" xml:space="preserve">one line in MIDDLEWARE</text><text x="420" y="58" class="m" font-size="12" fill="#5E636B" font-weight="700" letter-spacing="2.4" xml:space="preserve">REACT · RN</text><text x="420" y="100" class="m" font-size="19" fill="#F2F3F5" font-weight="700" xml:space="preserve">sdk/telemetry_client.js</text><text x="420" y="132" class="s" font-size="16" fill="#9A9FA7" xml:space="preserve">initTraceFlow() at startup</text><rect x="396" y="40" width="1" height="120" fill="#1C1E21"/><text x="804" y="58" class="m" font-size="12" fill="#5E636B" font-weight="700" letter-spacing="2.4" xml:space="preserve">ANYTHING</text><text x="804" y="100" class="m" font-size="19" fill="#F2F3F5" font-weight="700" xml:space="preserve">POST /api/ingest</text><text x="804" y="132" class="s" font-size="16" fill="#9A9FA7" xml:space="preserve">JSON: path, method, status</text><rect x="780" y="40" width="1" height="120" fill="#1C1E21"/><text x="36" y="176" class="m" font-size="12" fill="#5E636B" font-weight="700" letter-spacing="1.2" xml:space="preserve">no dependencies  ·  sends in the background  ·  silent when the map is off</text>
</svg>
