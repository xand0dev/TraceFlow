<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Changes: new parts glow red, changed parts get a dashed edge, everything since the session started.">
<title>Changes: new parts glow red, changed parts get a dashed edge, everything since the session started.</title>
<style>
.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes dash{to{stroke-dashoffset:-14}}
.breathe{animation:breathe 4s ease-in-out infinite}
.flow{stroke-dasharray:3 4;animation:dash 1.6s linear infinite}
@media (prefers-reduced-motion:reduce){.breathe,.flow{animation:none}}
.compact{display:none} @media (max-width:300px){.full{display:none} .compact{display:inline}}</style>
<defs>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#34363B"/><stop offset=".5" stop-color="#16171A"/><stop offset="1" stop-color="#26282C"/>
</linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<radialGradient id="redLight"><stop offset="0" stop-color="#E0101A" stop-opacity=".5"/>
  <stop offset=".4" stop-color="#E0101A" stop-opacity=".12"/><stop offset="1" stop-color="#E0101A" stop-opacity="0"/></radialGradient>
<linearGradient id="hair" x1="0" x2="1"><stop offset="0" stop-color="#8B8F96" stop-opacity=".45"/><stop offset="1" stop-color="#8B8F96" stop-opacity="0"/></linearGradient>
</defs>
<rect x="1" y="1" width="598" height="298" rx="16" fill="#050506" stroke="url(#edge)" stroke-width="1.5"/>
<g class="full">
<text x="36" y="52" class="m" font-size="12" fill="#5E636B" font-weight="700" letter-spacing="2.4" xml:space="preserve">CHANGES</text>
<text x="34" y="104" class="s" font-size="34" fill="#F2F3F5" font-weight="800" letter-spacing="-1.1" xml:space="preserve">What the agent did</text>
<text x="36" y="146" class="s" font-size="18" fill="#9A9FA7" xml:space="preserve">New parts glow red, changed</text>
<text x="36" y="172" class="s" font-size="18" fill="#9A9FA7" xml:space="preserve">ones get a dashed edge.</text>
<text x="36" y="198" class="s" font-size="18" fill="#9A9FA7" xml:space="preserve">Since the session started.</text>
<circle cx="490" cy="140" r="120" fill="url(#redLight)" class="breathe"/><rect x="410" y="74" width="150" height="30" rx="6" fill="#0B0C0E" stroke="#4A4E55" stroke-width="1.5"/><text x="422" y="93.0" class="m" font-size="11" fill="#C9CDD3" font-weight="700" xml:space="preserve">/api/orders</text><rect x="410" y="122" width="150" height="30" rx="6" fill="#0B0C0E" stroke="#FF2A2A" stroke-width="1.5" class="breathe"/><text x="422" y="141.0" class="m" font-size="11" fill="#F2F3F5" font-weight="700" xml:space="preserve">/api/pay</text><rect x="518" y="114" width="31" height="17" rx="4" fill="#E0101A"/><text x="533.5" y="126.5" class="m" font-size="10" fill="#FFFFFF" font-weight="700" letter-spacing="1" text-anchor="middle" xml:space="preserve">NEW</text><rect x="410" y="170" width="150" height="30" rx="6" fill="#0B0C0E" stroke="#E0101A" stroke-width="1.5" stroke-dasharray="4 3"/><text x="422" y="189" class="m" font-size="11" fill="#C9CDD3" font-weight="700" xml:space="preserve">Order</text><text x="410" y="236" class="m" font-size="11" fill="#5E636B" font-weight="700" letter-spacing="0.6" xml:space="preserve">+ paid_at  12s ago</text>
</g>
<g class="compact"><text x="36" y="120" class="s" font-size="64" fill="#F2F3F5" font-weight="800" letter-spacing="-2" xml:space="preserve">What the agent did</text></g>
</svg>
