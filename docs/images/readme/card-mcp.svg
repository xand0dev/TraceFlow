<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="MCP: Claude Code, Codex and Cursor ask the map before they touch the code.">
<title>MCP: Claude Code, Codex and Cursor ask the map before they touch the code.</title>
<style>
.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes dash{to{stroke-dashoffset:-14}}
.breathe{animation:breathe 4s ease-in-out infinite}
.flow{stroke-dasharray:3 4;animation:dash 1.6s linear infinite}
@media (prefers-reduced-motion:reduce){.breathe,.flow{animation:none}}
.compact{display:none} @media (max-width:300px){.full{display:none} .compact{display:inline}}</style>
<defs>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#34363B"/><stop offset=".5" stop-color="#16171A"/><stop offset="1" stop-color="#26282C"/>
</linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<radialGradient id="redLight"><stop offset="0" stop-color="#E0101A" stop-opacity=".5"/>
  <stop offset=".4" stop-color="#E0101A" stop-opacity=".12"/><stop offset="1" stop-color="#E0101A" stop-opacity="0"/></radialGradient>
<linearGradient id="hair" x1="0" x2="1"><stop offset="0" stop-color="#8B8F96" stop-opacity=".45"/><stop offset="1" stop-color="#8B8F96" stop-opacity="0"/></linearGradient>
</defs>
<rect x="1" y="1" width="598" height="298" rx="16" fill="#050506" stroke="url(#edge)" stroke-width="1.5"/>
<g class="full">
<text x="36" y="52" class="m" font-size="12" fill="#5E636B" font-weight="700" letter-spacing="2.4" xml:space="preserve">MCP</text>
<text x="34" y="104" class="s" font-size="34" fill="#F2F3F5" font-weight="800" letter-spacing="-1.1" xml:space="preserve">Your agent sees it</text>
<text x="36" y="146" class="s" font-size="18" fill="#9A9FA7" xml:space="preserve">Claude Code, Codex and Cursor</text>
<text x="36" y="172" class="s" font-size="18" fill="#9A9FA7" xml:space="preserve">ask the map before they touch</text>
<text x="36" y="198" class="s" font-size="18" fill="#9A9FA7" xml:space="preserve">the code.</text>
<rect x="396" y="70" width="180" height="150" rx="10" fill="#0B0C0E" stroke="#2A2C31" stroke-width="1.3"/><circle cx="412" cy="86" r="3" fill="#34363B"/><circle cx="424" cy="86" r="3" fill="#34363B"/><circle cx="436" cy="86" r="3" fill="#34363B"/><text x="410" y="116" class="m" font-size="11.5" fill="#C9CDD3" font-weight="700" xml:space="preserve">› trace</text><text x="410" y="134" class="m" font-size="11.5" fill="#9EA4AD" font-weight="500" xml:space="preserve">  /api/orders/</text><text x="410" y="158" class="m" font-size="11" fill="#5E636B" font-weight="500" xml:space="preserve">view  views.py:7</text><text x="410" y="176" class="m" font-size="11" fill="#5E636B" font-weight="500" xml:space="preserve">uses  Order</text><text x="410" y="194" class="m" font-size="11" fill="#5E636B" font-weight="500" xml:space="preserve">from  /cart</text><rect x="410" y="202" width="8" height="12" fill="#FF2A2A" class="breathe"/>
</g>
<g class="compact"><text x="36" y="120" class="s" font-size="64" fill="#F2F3F5" font-weight="800" letter-spacing="-2" xml:space="preserve">Your agent sees it</text></g>
</svg>
