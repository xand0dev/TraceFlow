<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Works with Claude Code and Codex (tested), Claude Desktop and Cursor (same MCP config).">
<title>Works with Claude Code and Codex (tested), Claude Desktop and Cursor (same MCP config).</title>
<style>
.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes dash{to{stroke-dashoffset:-14}}
.breathe{animation:breathe 4s ease-in-out infinite}
.flow{stroke-dasharray:3 4;animation:dash 1.6s linear infinite}
@media (prefers-reduced-motion:reduce){.breathe,.flow{animation:none}}
.compact{display:none} @media (max-width:560px){.full{display:none} .compact{display:inline}}</style>
<defs>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#34363B"/><stop offset=".5" stop-color="#16171A"/><stop offset="1" stop-color="#26282C"/>
</linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<radialGradient id="redLight"><stop offset="0" stop-color="#E0101A" stop-opacity=".5"/>
  <stop offset=".4" stop-color="#E0101A" stop-opacity=".12"/><stop offset="1" stop-color="#E0101A" stop-opacity="0"/></radialGradient>
<linearGradient id="hair" x1="0" x2="1"><stop offset="0" stop-color="#8B8F96" stop-opacity=".45"/><stop offset="1" stop-color="#8B8F96" stop-opacity="0"/></linearGradient>
</defs>
<rect x="1" y="1" width="1198" height="118" rx="14" fill="#050506" stroke="url(#edge)" stroke-width="1.5"/>
<rect x="36" y="34" width="181" height="52" rx="10" fill="#0B0C0E" stroke="#3E4248" stroke-width="1.3"/><circle cx="60" cy="60" r="4" fill="#FF2A2A" filter="url(#glow)"/><text x="76" y="65" class="m" font-size="15" fill="#F2F3F5" font-weight="700" letter-spacing="1.6" xml:space="preserve">CLAUDE CODE</text><rect x="234.6" y="34" width="117" height="52" rx="10" fill="#0B0C0E" stroke="#3E4248" stroke-width="1.3"/><circle cx="258.6" cy="60" r="4" fill="#FF2A2A" filter="url(#glow)"/><text x="274.6" y="65" class="m" font-size="15" fill="#F2F3F5" font-weight="700" letter-spacing="1.6" xml:space="preserve">CODEX</text><rect x="369.6" y="34" width="212" height="52" rx="10" fill="#0B0C0E" stroke="#3E4248" stroke-width="1.3"/><circle cx="393.6" cy="60" r="4" fill="#3E4248"/><text x="409.6" y="65" class="m" font-size="15" fill="#9A9FA7" font-weight="700" letter-spacing="1.6" xml:space="preserve">CLAUDE DESKTOP</text><rect x="600.0" y="34" width="128" height="52" rx="10" fill="#0B0C0E" stroke="#3E4248" stroke-width="1.3"/><circle cx="624.0" cy="60" r="4" fill="#3E4248"/><text x="640.0" y="65" class="m" font-size="15" fill="#9A9FA7" font-weight="700" letter-spacing="1.6" xml:space="preserve">CURSOR</text><text x="1164" y="54" class="m" font-size="11" fill="#FF2A2A" font-weight="700" letter-spacing="1.6" text-anchor="end" xml:space="preserve">● TESTED</text><text x="1164" y="76" class="m" font-size="11" fill="#5E636B" font-weight="700" letter-spacing="1.6" text-anchor="end" xml:space="preserve">● SAME CONFIG</text>
</svg>
